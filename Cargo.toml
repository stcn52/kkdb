[package]
name = "kkdb"
version = "0.1.0"
edition = "2021"
description = "A PostgreSQL-style relational database engine in Rust"

[dependencies]
thiserror = "1.0"
rustyline = "12.0"
sqlparser = "0.61"
crc32fast = "1.5.0"
lz4_flex = { version = "0.11", default-features = false }
tokio = { version = "1.50.0", features = ["full"] }
msql-srv = "0.11.0"
# HTTP API (Supabase-style)
axum = { version = "0.7", features = ["json"] }
jsonwebtoken = "9"
bcrypt = "0.15"
uuid = { version = "1", features = ["v4"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Raft distributed consensus
openraft = { version = "0.9", features = ["serde", "storage-v2"] }
# Raft HTTP client transport
reqwest = { version = "0.12", features = ["json"], default-features = false }
# MySQL native password auth
sha1 = "0.10"
rand = "0.8"
tokenizers = "0.22.2"
ahash = "0.8.12"
# Chinese word segmentation for FTS tokenizer
jieba-rs = "0.7"
# R29: TLS support for MySQL protocol
tokio-rustls = "0.26"
rustls-pemfile = "2"

[dev-dependencies]
mysql_async = "0.36.1"
tower = { version = "0.5", features = ["util"] }
serde_json = "1"
tempfile = "3"
