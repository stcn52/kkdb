# ============================================================
# KKDB CI/CD Pipeline
# ============================================================
# 触发条件: push/PR 到 master 和 develop
# 阶段: fmt → clippy → test → coverage → docker (可选)
# ============================================================

name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # ── 格式检查 ──────────────────────────────────────────────
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  # ── Clippy 静态分析 ──────────────────────────────────────
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features -- -A clippy::approx_constant

  # ── 编译检查（多平台） ─────────────────────────────────
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-targets

  # ── 单元测试 + 集成测试 ─────────────────────────────────
  test:
    name: Test (Rust ${{ matrix.rust }})
    runs-on: ubuntu-latest
    needs: [fmt, clippy]
    strategy:
      fail-fast: false
      matrix:
        rust: [stable, "1.75"]  # MSRV + stable
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --release -- --test-threads=1
        env:
          KKDB_PAGE_SIZE: 4096

      - name: Run tests (page_size=8192)
        run: cargo test --release -- --test-threads=1
        env:
          KKDB_PAGE_SIZE: 8192

  # ── 代码覆盖率 ──────────────────────────────────────────
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin --locked

      - name: Generate coverage
        run: |
          cargo tarpaulin \
            --out json --out html \
            --output-dir target/coverage \
            --engine llvm \
            --timeout 600 \
            --skip-clean \
            -- --test-threads=1
        env:
          KKDB_PAGE_SIZE: 4096

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            target/coverage/tarpaulin-report.html
            target/coverage/tarpaulin-report.json
          retention-days: 30

      - name: Check coverage threshold
        run: |
          COVERAGE=$(python3 -c "
          import json
          with open('target/coverage/tarpaulin-report.json') as f:
              data = json.load(f)
          files = data.get('files', [])
          total_lines = sum(f.get('coverable', 0) for f in files)
          covered = sum(f.get('covered', 0) for f in files)
          pct = (covered / total_lines * 100) if total_lines > 0 else 0
          print(f'{pct:.1f}')
          ")
          echo "Coverage: ${COVERAGE}%"
          # 警告阈值（不阻塞 CI）
          python3 -c "
          cov = float('${COVERAGE}')
          if cov < 50:
              print('::warning::Coverage is below 50%: ${COVERAGE}%')
          else:
              print(f'Coverage OK: ${COVERAGE}%')
          "

  # ── Docker 镜像构建 ─────────────────────────────────────
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: kkdb:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Release 构建产物 ────────────────────────────────────
  release-build:
    name: Release Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    needs: [test]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: kkdb-linux-amd64
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: kkdb-macos-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}
        env:
          KKDB_PAGE_SIZE: 4096

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: target/${{ matrix.target }}/release/kkdb
          retention-days: 90
